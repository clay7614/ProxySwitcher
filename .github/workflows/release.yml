name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build Standard (Self-Contained)
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=true -o bin/Publish/Standard

    - name: Build Lightweight (Framework-Dependent)
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=false -o bin/Publish/Lightweight

    - name: Package Assets
      shell: pwsh
      run: |
        mkdir release_assets
        # Standard
        Compress-Archive -Path bin/Publish/Standard/* -DestinationPath "release_assets/ProxySwitcher_${env:GITHUB_REF_NAME}_Standard.zip" -Force
        # Lightweight
        Compress-Archive -Path bin/Publish/Lightweight/* -DestinationPath "release_assets/ProxySwitcher_${env:GITHUB_REF_NAME}_Lightweight.zip" -Force

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}