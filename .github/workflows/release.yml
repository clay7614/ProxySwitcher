name: Release Local Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Package Assets
      shell: pwsh
      run: |
        mkdir release_assets
        $tag = $env:GITHUB_REF_NAME
        
        # Standard
        $stdExe = "bin/Publish/Standard/ProxySwitcher.exe"
        if (Test-Path $stdExe) {
            $stdDestExe = "release_assets/ProxySwitcher_${tag}_Standard.exe"
            Copy-Item $stdExe $stdDestExe
            Compress-Archive -Path $stdDestExe -DestinationPath "release_assets/ProxySwitcher_${tag}_Standard.zip" -Force
        } else {
            Write-Error "Standard EXE not found at $stdExe"
        }
        
        # Lightweight
        $lwExe = "bin/Publish/Lightweight/ProxySwitcher.exe"
        if (Test-Path $lwExe) {
            $lwDestExe = "release_assets/ProxySwitcher_${tag}_Lightweight.exe"
            Copy-Item $lwExe $lwDestExe
            Compress-Archive -Path $lwDestExe -DestinationPath "release_assets/ProxySwitcher_${tag}_Lightweight.zip" -Force
        } else {
             Write-Error "Lightweight EXE not found at $lwExe"
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/*.exe
          release_assets/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}