name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Rename executables for release
      shell: pwsh
      run: |
        mkdir -p release_assets
        Copy-Item bin/Publish/Standalone/ProxySwitcher.exe release_assets/ProxySwitcher_Standalone.exe
        Copy-Item bin/Publish/Dependent/ProxySwitcher.exe release_assets/ProxySwitcher_Lightweight.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/ProxySwitcher_Standalone.exe
          release_assets/ProxySwitcher_Lightweight.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
