name: Release Local Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.x' # Use .NET SDK to build .NET Framework apps

    - name: Build
      run: dotnet build -c Release

    - name: Package Assets
      shell: pwsh
      run: |
        mkdir release_assets
        $tag = $env:GITHUB_REF_NAME
        
        # Target File
        $exePath = "bin/Release/net48/ProxySwitcher.exe"
        
        if (Test-Path $exePath) {
            # Copy EXE
            $destExe = "release_assets/ProxySwitcher_${tag}.exe"
            Copy-Item $exePath $destExe
            
            # Create ZIP
            Compress-Archive -Path $destExe -DestinationPath "release_assets/ProxySwitcher_${tag}.zip" -Force
        } else {
            Write-Error "Build artifact not found at $exePath"
        }

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/*.exe
          release_assets/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}