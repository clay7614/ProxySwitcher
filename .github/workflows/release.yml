name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Build Standard (Self-Contained)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o bin/Publish/Standard

    - name: Build Lightweight (Framework-Dependent)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=false -o bin/Publish/Lightweight

    - name: Package Assets
      shell: pwsh
      run: |
        mkdir release_assets
        $tag = $env:GITHUB_REF_NAME
        
        # Standard
        $stdExe = "bin/Publish/Standard/ProxySwitcher.exe"
        $stdDestExe = "release_assets/ProxySwitcher_${tag}_Standard.exe"
        Copy-Item $stdExe $stdDestExe
        Compress-Archive -Path $stdDestExe -DestinationPath "release_assets/ProxySwitcher_${tag}_Standard.zip" -Force
        
        # Lightweight
        $lwExe = "bin/Publish/Lightweight/ProxySwitcher.exe"
        $lwDestExe = "release_assets/ProxySwitcher_${tag}_Lightweight.exe"
        Copy-Item $lwExe $lwDestExe
        Compress-Archive -Path $lwDestExe -DestinationPath "release_assets/ProxySwitcher_${tag}_Lightweight.zip" -Force

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_assets/ProxySwitcher_${{ github.ref_name }}_Standard.exe
          release_assets/ProxySwitcher_${{ github.ref_name }}_Standard.zip
          release_assets/ProxySwitcher_${{ github.ref_name }}_Lightweight.exe
          release_assets/ProxySwitcher_${{ github.ref_name }}_Lightweight.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}