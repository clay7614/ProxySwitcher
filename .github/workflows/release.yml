name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Standalone (Standalone)
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=true -o publish/standalone

    - name: Build Lightweight (Dependent)
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:PublishTrimmed=false /p:EnableCompressionInSingleFile=false -o publish/dependent

    - name: Rename executables
      shell: pwsh
      run: |
        Move-Item publish/standalone/ProxySwitcher.exe publish/ProxySwitcher_Standalone.exe
        Move-Item publish/dependent/ProxySwitcher.exe publish/ProxySwitcher_Lightweight.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          publish/ProxySwitcher_Standalone.exe
          publish/ProxySwitcher_Lightweight.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
